<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Owl exceeding target, crowned">
  <defs>
    <linearGradient id="bodyGrad-crowned" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CA26B"/>
      <stop offset="1" stop-color="#557548"/>
    </linearGradient>
    <linearGradient id="wingGrad-crowned" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C7D4F"/>
      <stop offset="1" stop-color="#456238"/>
    </linearGradient>
    <linearGradient id="bellyGrad-crowned" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F0E7D6"/>
    </linearGradient>
    <linearGradient id="beakGrad-crowned" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3B657"/>
      <stop offset="1" stop-color="#C6912E"/>
    </linearGradient>
    <linearGradient id="crownGrad-crowned" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1CD73"/>
      <stop offset="1" stop-color="#D8A83E"/>
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="190" rx="46" ry="7" fill="#2B2620" opacity="0.08"/>

  <!-- feet -->
  <ellipse cx="80" cy="182" rx="9" ry="6" fill="url(#beakGrad-crowned)"/>
  <ellipse cx="120" cy="182" rx="9" ry="6" fill="url(#beakGrad-crowned)"/>

  <!-- wings -->
  <path d="M58,92 C42,100 34,128 46,158 C58,144 64,116 58,92 Z" fill="url(#wingGrad-crowned)"/>
  <path d="M142,92 C158,100 166,128 154,158 C142,144 136,116 142,92 Z" fill="url(#wingGrad-crowned)"/>

  <!-- body + head -->
  <path d="M100,40
           C90,40 82,45 76,52
           C68,49 61,53 62,62
           C48,74 40,94 40,116
           C40,154 66,182 100,182
           C134,182 160,154 160,116
           C160,94 152,74 138,62
           C139,53 132,49 124,52
           C118,45 110,40 100,40 Z"
        fill="url(#bodyGrad-crowned)"/>

  <!-- belly -->
  <path d="M100,96
           C118,96 129,112 128,134
           C127,158 116,174 100,174
           C84,174 73,158 72,134
           C71,112 82,96 100,96 Z"
        fill="url(#bellyGrad-crowned)"/>

  <!-- eyes -->
  <ellipse cx="82" cy="92" rx="15" ry="16" fill="#FFFDF8"/>
  <ellipse cx="118" cy="92" rx="15" ry="16" fill="#FFFDF8"/>
  <circle cx="85" cy="94" r="6" fill="#2B2620"/>
  <circle cx="115" cy="94" r="6" fill="#2B2620"/>
  <circle cx="87.5" cy="91.5" r="1.8" fill="#FFFDF8"/>
  <circle cx="117.5" cy="91.5" r="1.8" fill="#FFFDF8"/>

  <!-- beak -->
  <path d="M100,104 C95,104 91,108 92,113 C93,117 96,120 100,120 C104,120 107,117 108,113 C109,108 105,104 100,104 Z"
        fill="url(#beakGrad-crowned)"/>

  <!-- crown -->
  <path d="M66,44 L74,20 L86,36 L100,14 L114,36 L126,20 L134,44 Z"
        fill="url(#crownGrad-crowned)"/>
  <circle cx="74" cy="20" r="3.4" fill="#F1CD73"/>
  <circle cx="100" cy="14" r="3.4" fill="#F1CD73"/>
  <circle cx="126" cy="20" r="3.4" fill="#F1CD73"/>

  <!-- sparkles -->
  <path d="M30,58 L33.4,65.6 L41,69 L33.4,72.4 L30,80 L26.6,72.4 L19,69 L26.6,65.6 Z" fill="#D8A83E" opacity="0.9"/>
  <path d="M172,66 L174.8,72.2 L181,75 L174.8,77.8 L172,84 L169.2,77.8 L163,75 L169.2,72.2 Z" fill="#D8A83E" opacity="0.9"/>
</svg>
