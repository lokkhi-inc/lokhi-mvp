<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="-10 -6 220 230" style="width:100%;height:100%;display:block;overflow:visible">
<defs>
<filter id="wob" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"></feDisplacementMap></filter>
<pattern id="cK" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="6" height="6" fill="#f7c9d1"></rect><line x1="1" y1="0" x2="1" y2="6" style="stroke:#ec97a8;stroke-width:2.4"></line></pattern>
</defs>
<g filter="{{ filt }}" fill="#fffdf8" style="stroke:#3a3a38;stroke-width:3;stroke-linecap:round;stroke-linejoin:round">
<path d="M62 186 C38 192 30 176 40 164 C46 158 54 164 48 170" fill="none"></path>
<ellipse cx="94" cy="166" rx="34" ry="40"></ellipse>
<ellipse cx="82" cy="208" rx="11" ry="5"></ellipse><ellipse cx="110" cy="208" rx="11" ry="5"></ellipse>
<path d="M66 150 C56 162 56 174 62 182" fill="none"></path>
<sc-if value="{{ armDown }}" hint-placeholder-val="{{ true }}"><path d="M122 150 C134 162 136 176 130 184" fill="none"></path></sc-if>
<sc-if value="{{ explain }}" hint-placeholder-val="{{ false }}"><path d="M124 148 C138 142 150 132 160 120" fill="none"></path><circle cx="163" cy="117" r="5.5"></circle></sc-if>
<path d="M58 66 C38 52 32 80 44 94 C50 100 58 92 60 82"></path>
<path d="M96 44 C98 22 118 18 124 30 C128 40 116 48 108 50"></path>
<sc-if value="{{ colored }}" hint-placeholder-val="{{ true }}"><path d="M52 68 C42 64 40 80 46 88 Z M104 40 C106 30 116 28 118 34 Z" fill="url(#cK)" style="stroke-width:0"></path></sc-if>
<circle cx="96" cy="88" r="46"></circle>
<path d="M134 70 C152 70 164 82 160 92 C156 100 142 102 130 100"></path>
<circle cx="160" cy="88" r="4.5" fill="#3a3a38"></circle>
<circle cx="110" cy="102" r="11" fill="{{ kF }}" style="stroke-width:2.2"></circle>
<circle cx="106" cy="100" r="1.4" fill="#3a3a38" style="stroke-width:0"></circle><circle cx="113" cy="98" r="1.4" fill="#3a3a38" style="stroke-width:0"></circle><circle cx="111" cy="106" r="1.4" fill="#3a3a38" style="stroke-width:0"></circle>
<sc-if value="{{ neutral }}" hint-placeholder-val="{{ true }}"><circle cx="124" cy="78" r="4.5" fill="#3a3a38"></circle></sc-if>
<sc-if value="{{ happy }}" hint-placeholder-val="{{ false }}"><path d="M117 80 Q123 72 130 80" fill="none"></path><path d="M138 101 Q144 107 150 100" fill="none" style="stroke-width:2.4"></path></sc-if>
<sc-if value="{{ explain }}" hint-placeholder-val="{{ false }}"><circle cx="124" cy="78" r="4.5" fill="#3a3a38"></circle><path d="M114 66 L128 62" fill="none" style="stroke-width:2.4"></path><path d="M138 100 Q144 108 152 99" fill="none" style="stroke-width:2.4"></path></sc-if>
</g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:230},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;happy&quot;,&quot;explain&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;colored&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;wobble&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood ?? 'neutral', c = this.props.colored ?? true;
    return {
      filt: (this.props.wobble ?? true) ? 'url(#wob)' : 'none',
      colored: c, kF: c ? 'url(#cK)' : '#fffdf8',
      neutral: mood === 'neutral', happy: mood === 'happy', explain: mood === 'explain', armDown: mood !== 'explain'
    };
  }
}
</script>
</body>
</html>
